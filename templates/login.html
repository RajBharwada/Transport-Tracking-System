<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Mumbai Bus Tracker</title>
<style>
  body { font-family: sans-serif; background: #1f3a5f; display: flex;
         justify-content: center; align-items: center; height: 100vh; margin: 0; }
  form { background: #fff; padding: 24px; border-radius: 8px; width: 260px; }
  input { width: 100%; padding: 8px; margin: 6px 0 12px; box-sizing: border-box; }
  button { width: 100%; padding: 10px; background: #1f3a5f; color: #fff; border: 0; }
  .err { color: #b00020; margin-bottom: 8px; }
</style>
</head>
<body>
<form method="post">
  <h3>Mumbai Bus Tracker</h3>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <label>Username</label>
  <input name="username" required>
  <label>Password</label>
  <input name="password" type="password" required>
  <button type="submit">Login</button>
</form>
</body>
