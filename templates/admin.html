<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Mumbai Bus Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="bar">
  <a class="brand" href="/admin"><i>B</i><b>Admin Console</b></a>
  <nav><a href="/">Live map</a></nav>
  <div class="who"><strong>{{ username }}</strong> <a href="/logout">Logout</a></div>
</header>

<div id="msg" role="status"></div>

<div class="page">
  <div class="grid3">
    <section class="card">
      <h2>Add bus</h2>
      <div class="row"><input id="bReg" placeholder="Reg no, e.g. MH01AB1005" aria-label="Registration number" style="flex:1 1 100%"></div>
      <div class="row">
        <input id="bCap" type="number" placeholder="Capacity" aria-label="Capacity" style="width:110px">
        <select id="bStatus" aria-label="Status">
          <option>active</option><option>maintenance</option><option>retired</option>
        </select>
      </div>
      <div class="row"><button class="accent" onclick="addBus()">Add bus</button></div>
    </section>

    <section class="card">
      <h2>Add driver</h2>
      <div class="row"><input id="dName" placeholder="Name" aria-label="Name" style="flex:1 1 100%"></div>
      <div class="row"><input id="dPhone" placeholder="Phone" aria-label="Phone" style="flex:1 1 40%">
        <input id="dLic" placeholder="Licence no" aria-label="Licence number" style="flex:1 1 40%"></div>
      <div class="row"><button class="accent" onclick="addDriver()">Add driver</button></div>
    </section>

    <section class="card">
      <h2>Schedule trip</h2>
      <div class="row">
        <select id="tRoute" aria-label="Route"><option>R1</option><option>R2</option></select>
        <input id="tBus" type="number" placeholder="Bus id" aria-label="Bus id" style="width:100px">
        <input id="tDriver" type="number" placeholder="Driver id" aria-label="Driver id" style="width:110px">
      </div>
      <div class="row"><button class="accent" onclick="addTrip()">Schedule</button></div>
    </section>
  </div>

  <section class="card stack"><h2>Buses</h2><div id="buses"></div></section>
  <section class="card"><h2>Drivers</h2><div id="drivers"></div></section>
  <section class="card"><h2>Recent trips</h2><div id="trips"></div></section>
  <div class="grid2">
    <section class="card"><h2>Delay report (view)</h2><div id="report"></div></section>
    <section class="card"><h2>Recent delay alerts</h2><div id="alerts"></div></section>
  </div>
</div>

<script>
const msg = document.getElementById('msg');

function esc(s) {
  return String(s === null ? '' : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function show(text, bad) {
  msg.textContent = text;
  msg.className = bad ? 'bad' : 'ok';
  msg.style.display = 'block';
}

async function post(url, body) {
  const r = await fetch(url, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
  const j = await r.json();
  show(j.error ? 'Error: ' + j.error : j.message, !!j.error);
  await load();
}

function cell(key, value) {
  if (key === 'status') return '<span class="tag tag-' + esc(value) + '">' + esc(value) + '</span>';
  return esc(value);
}

function render(id, cols, rows, actions) {
  let h = '<table><tr>' + cols.map(c => '<th>' + esc(c[0]) + '</th>').join('') +
          (actions ? '<th>Actions</th>' : '') + '</tr>';
  rows.forEach(r => {
    h += '<tr>' + cols.map(c => '<td>' + cell(c[1], r[c[1]]) + '</td>').join('') +
         (actions ? '<td>' + actions(r) + '</td>' : '') + '</tr>';
  });
  document.getElementById(id).innerHTML = h + '</table>';
}

async function load() {
  const r = await fetch('/api/admin/overview');
  if (!r.ok) { show('Could not load data', true); return; }
  const d = await r.json();
  render('buses', [['ID','bus_id'],['Reg no','reg_no'],['Capacity','capacity'],['Status','status']],
    d.buses, b =>
      '<button class="amber small" onclick="setStatus(' + b.bus_id + ',\'maintenance\')">Maintenance</button>' +
      '<button class="small" onclick="setStatus(' + b.bus_id + ',\'active\')">Active</button>' +
      '<button class="red small" onclick="delBus(' + b.bus_id + ')">Delete</button>');
  render('drivers', [['ID','driver_id'],['Name','name'],['Phone','phone'],['Licence','license_no']], d.drivers);
  render('trips', [['Trip','trip_id'],['Route','route_no'],['Bus','reg_no'],['Driver','driver_name'],['Status','status']], d.trips);
  render('report', [['Route','route_no'],['Arrivals','arrivals_recorded'],['Avg delay','avg_delay_min'],['Max delay','max_delay_min'],['Alerts','alerts_raised']], d.report);
  render('alerts', [['Alert','alert_id'],['Route','route_no'],['Bus','reg_no'],['Stop','stop_name'],['Delay (min)','delay_min'],['Time','created_at']], d.alerts);
}

function addBus() {
  post('/api/admin/bus', {
    reg_no: document.getElementById('bReg').value,
    capacity: document.getElementById('bCap').value,
    status: document.getElementById('bStatus').value
  });
}

function addDriver() {
  post('/api/admin/driver', {
    name: document.getElementById('dName').value,
    phone: document.getElementById('dPhone').value,
    license_no: document.getElementById('dLic').value
  });
}

function addTrip() {
  post('/api/admin/trip', {
    route_no: document.getElementById('tRoute').value,
    bus_id: document.getElementById('tBus').value,
    driver_id: document.getElementById('tDriver').value
  });
}

function setStatus(id, status) { post('/api/admin/bus/status', {bus_id: id, status: status}); }
function delBus(id) {
  if (confirm('Delete bus ' + id + '?')) post('/api/admin/bus/delete', {bus_id: id});
}

load();
</script>
</body>
</html>
