<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Mumbai Bus Tracker</title>
<style>
  body { font-family: sans-serif; margin: 0; background: #f4f6f9; }
  #bar { padding: 10px; background: #1f3a5f; color: #fff; display: flex;
         gap: 12px; align-items: center; }
  #bar a { color: #fff; }
  .card { background: #fff; margin: 12px; padding: 14px; border-radius: 8px;
          overflow-x: auto; }
  input, select, button { padding: 7px; margin: 3px 3px 3px 0; }
  button { background: #1f3a5f; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
  button.red { background: #b00020; }
  button.amber { background: #b26a00; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { border-bottom: 1px solid #ddd; padding: 6px 8px; text-align: left; }
  th { background: #eef1f6; }
  #msg { margin: 12px; padding: 10px; border-radius: 6px; display: none; }
  .ok { background: #d9f2e0; } .bad { background: #fbd9dc; }
</style>
</head>
<body>
<div id="bar">
  <b>Admin Console</b>
  <a href="/">Live map</a>
  <span style="margin-left:auto">{{ username }} &nbsp; <a href="/logout">Logout</a></span>
</div>

<div id="msg"></div>

<div class="card">
  <b>Add bus</b><br>
  <input id="bReg" placeholder="Reg no, e.g. MH01AB1005">
  <input id="bCap" type="number" placeholder="Capacity" style="width:100px">
  <select id="bStatus">
    <option>active</option><option>maintenance</option><option>retired</option>
  </select>
  <button onclick="addBus()">Add bus</button>
</div>

<div class="card">
  <b>Add driver</b><br>
  <input id="dName" placeholder="Name">
  <input id="dPhone" placeholder="Phone">
  <input id="dLic" placeholder="Licence no">
  <button onclick="addDriver()">Add driver</button>
</div>

<div class="card">
  <b>Schedule trip</b><br>
  <select id="tRoute"><option>R1</option><option>R2</option></select>
  <input id="tBus" type="number" placeholder="Bus id" style="width:90px">
  <input id="tDriver" type="number" placeholder="Driver id" style="width:90px">
  <button onclick="addTrip()">Schedule</button>
</div>

<div class="card"><b>Buses</b><div id="buses"></div></div>
<div class="card"><b>Drivers</b><div id="drivers"></div></div>
<div class="card"><b>Recent trips</b><div id="trips"></div></div>
<div class="card"><b>Delay report (view)</b><div id="report"></div></div>
<div class="card"><b>Recent delay alerts</b><div id="alerts"></div></div>

<script>
const msg = document.getElementById('msg');

function esc(s) {
  return String(s === null ? '' : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function show(text, bad) {
  msg.textContent = text;
  msg.className = bad ? 'bad' : 'ok';
  msg.style.display = 'block';
}

async function post(url, body) {
  const r = await fetch(url, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
  const j = await r.json();
  show(j.error ? 'Error: ' + j.error : j.message, !!j.error);
  await load();
}

function render(id, cols, rows, actions) {
  let h = '<table><tr>' + cols.map(c => '<th>' + esc(c[0]) + '</th>').join('') +
          (actions ? '<th>Actions</th>' : '') + '</tr>';
  rows.forEach(r => {
    h += '<tr>' + cols.map(c => '<td>' + esc(r[c[1]]) + '</td>').join('') +
         (actions ? '<td>' + actions(r) + '</td>' : '') + '</tr>';
  });
  document.getElementById(id).innerHTML = h + '</table>';
}

async function load() {
  const r = await fetch('/api/admin/overview');
  if (!r.ok) { show('Could not load data', true); return; }
  const d = await r.json();
  render('buses', [['ID','bus_id'],['Reg no','reg_no'],['Capacity','capacity'],['Status','status']],
    d.buses, b =>
      '<button class="amber" onclick="setStatus(' + b.bus_id + ',\'maintenance\')">Maintenance</button>' +
      '<button onclick="setStatus(' + b.bus_id + ',\'active\')">Active</button>' +
      '<button class="red" onclick="delBus(' + b.bus_id + ')">Delete</button>');
  render('drivers', [['ID','driver_id'],['Name','name'],['Phone','phone'],['Licence','license_no']], d.drivers);
  render('trips', [['Trip','trip_id'],['Route','route_no'],['Bus','reg_no'],['Driver','driver_name'],['Status','status']], d.trips);
  render('report', [['Route','route_no'],['Arrivals','arrivals_recorded'],['Avg delay','avg_delay_min'],['Max delay','max_delay_min'],['Alerts','alerts_raised']], d.report);
  render('alerts', [['Alert','alert_id'],['Route','route_no'],['Bus','reg_no'],['Stop','stop_name'],['Delay (min)','delay_min'],['Time','created_at']], d.alerts);
}

function addBus() {
  post('/api/admin/bus', {
    reg_no: document.getElementById('bReg').value,
    capacity: document.getElementById('bCap').value,
    status: document.getElementById('bStatus').value
  });
}

function addDriver() {
  post('/api/admin/driver', {
    name: document.getElementById('dName').value,
    phone: document.getElementById('dPhone').value,
    license_no: document.getElementById('dLic').value
  });
}

function addTrip() {
  post('/api/admin/trip', {
    route_no: document.getElementById('tRoute').value,
    bus_id: document.getElementById('tBus').value,
    driver_id: document.getElementById('tDriver').value
  });
}

function setStatus(id, status) { post('/api/admin/bus/status', {bus_id: id, status: status}); }
function delBus(id) {
  if (confirm('Delete bus ' + id + '?')) post('/api/admin/bus/delete', {bus_id: id});
}

load();
</script>
</body>
</html>
