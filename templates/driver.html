<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driver - Mumbai Bus Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="driver">
<header class="bar">
  <a class="brand" href="/driver"><i>B</i><b>Driver Console</b></a>
  <div class="who"><strong>{{ username }}</strong> <a href="/logout">Logout</a></div>
</header>

<div id="msg" role="status"></div>

<div class="page">
  <section class="card">
    <h2>My trips</h2>
    <div class="row"><select id="tripSel" aria-label="Trip"></select></div>
    <div class="row">
      <button class="accent" onclick="act('/api/driver/start')">Start trip</button>
      <button class="red" onclick="act('/api/driver/end')">End trip</button>
    </div>
  </section>

  <section class="card">
    <h2>Position and arrivals</h2>
    <div class="row"><select id="stopSel" aria-label="Stop"></select></div>
    <div class="row">
      <button onclick="pingStop()">Ping at selected stop</button>
      <button onclick="pingGPS()">Ping with device GPS</button>
    </div>
    <div class="row">
      <label class="field" for="delay">Delay (min, demo):
        <input id="delay" type="number" value="0" min="0"></label>
      <button class="accent" onclick="arrive()">Mark arrived at selected stop</button>
    </div>
  </section>
</div>

<script>
let trips = [];
let stops = [];
const tripSel = document.getElementById('tripSel');
const stopSel = document.getElementById('stopSel');
const msg = document.getElementById('msg');

function show(text, bad) {
  msg.textContent = text;
  msg.className = bad ? 'bad' : 'ok';
  msg.style.display = 'block';
}

async function post(url, body) {
  const r = await fetch(url, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
  const j = await r.json();
  show(j.error ? 'Error: ' + j.error : j.message, !!j.error);
  return j;
}

async function loadTrips() {
  const keep = tripSel.value;
  trips = await (await fetch('/api/driver/trips')).json();
  tripSel.innerHTML = '';
  trips.forEach(t => {
    const o = document.createElement('option');
    o.value = t.trip_id;
    o.textContent = '#' + t.trip_id + '  ' + t.route_no + '  ' +
                    t.reg_no + '  [' + t.status + ']';
    tripSel.appendChild(o);
  });
  if (keep) tripSel.value = keep;
  await loadStops();
}

async function loadStops() {
  stopSel.innerHTML = '';
  stops = [];
  const t = trips.find(x => x.trip_id == tripSel.value);
  if (!t) return;
  stops = await (await fetch('/api/route/' + t.route_no + '/stops')).json();
  stops.forEach(s => {
    const o = document.createElement('option');
    o.value = s.stop_id;
    o.textContent = s.stop_seq + '. ' + s.name;
    stopSel.appendChild(o);
  });
}

async function act(url) {
  await post(url, { trip_id: tripSel.value });
  await loadTrips();
}

async function pingStop() {
  const s = stops.find(x => x.stop_id == stopSel.value);
  if (!s) return;
  await post('/api/driver/ping', {
    trip_id: tripSel.value, lat: s.latitude, lon: s.longitude,
    speed: Math.round(Math.random() * 20 + 10)
  });
}

function pingGPS() {
  if (!navigator.geolocation) { show('GPS not available', true); return; }
  navigator.geolocation.getCurrentPosition(
    p => post('/api/driver/ping', {
      trip_id: tripSel.value, lat: p.coords.latitude, lon: p.coords.longitude,
      speed: (p.coords.speed || 0) * 3.6
    }),
    e => show('GPS error: ' + e.message, true)
  );
}

async function arrive() {
  const j = await post('/api/driver/arrive', {
    trip_id: tripSel.value, stop_id: stopSel.value,
    delay: document.getElementById('delay').value
  });
  // Arriving at a stop also puts the bus at that stop on the commuter map:
  // the map reads the latest GPS ping, and an arrival alone does not create one.
  if (!j.error) {
    const s = stops.find(x => x.stop_id == stopSel.value);
    if (s) {
      const msg = j.message;
      await post('/api/driver/ping', {
        trip_id: tripSel.value, lat: s.latitude, lon: s.longitude, speed: 0
      });
      show(msg + ' - bus moved to ' + s.name);
    }
  }
}

tripSel.addEventListener('change', loadStops);
loadTrips();
</script>
</body>
</html>
