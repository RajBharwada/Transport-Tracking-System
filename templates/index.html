<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mumbai Bus Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="bar">
  <a class="brand" href="/"><i>B</i><b>Mumbai Bus Tracker</b></a>
  <div class="who">
    {% if username %}<strong>{{ username }}</strong> <span class="role">({{ role }})</span>
    {% if role == 'admin' %}<a href="/admin">Admin</a>{% endif %}
    {% if role == 'driver' %}<a href="/driver">Driver console</a>{% endif %}
    <a href="/logout">Logout</a>
    {% else %}<a href="/login">Staff login</a>{% endif %}</div>
</header>
<main class="mapwrap">
  <div id="map"></div>
  <aside class="board">
    <label for="routeSel">Route</label>
    <select id="routeSel"></select>
    <div id="status" role="status"></div>
    <p class="hint">Select a stop on the map to see the next buses.</p>
  </aside>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([19.03, 72.84], 13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const sel = document.getElementById('routeSel');
const statusEl = document.getElementById('status');
const stopLayer = L.layerGroup().addTo(map);
const busLayer = L.layerGroup().addTo(map);

function esc(s) {
  return String(s === null ? '' : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function getJSON(url) {
  const r = await fetch(url);
  return r.json();
}

// Road-following path between the stops: a saved file first, then the public OSRM
// routing service; if neither is available, the stops are joined by straight lines.
const roadCache = {};
let routePath = [];
let loadToken = 0;

async function roadPath(pts, routeNo) {
  const key = routeNo + '|' + pts.map(p => p.join(',')).join(';');
  if (roadCache[key]) return roadCache[key];
  try {   // 1) saved path from tools/build_route_paths.py (works offline)
    const f = await fetch('/static/routes/' + encodeURIComponent(routeNo) + '.json');
    if (f.ok) { roadCache[key] = await f.json(); return roadCache[key]; }
  } catch (e) { /* not generated yet */ }
  try {   // 2) live OSRM lookup
    const coords = pts.map(p => p[1] + ',' + p[0]).join(';');
    const r = await fetch('https://router.project-osrm.org/route/v1/driving/' + coords +
                          '?overview=full&geometries=geojson');
    const j = await r.json();
    if (j.code === 'Ok') {
      roadCache[key] = j.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
      return roadCache[key];
    }
  } catch (e) { /* fall back to straight lines */ }
  return pts;
}

// Draw a bus on the nearest point of the road path (display only; stored data is unchanged).
function snapToRoute(lat, lon) {
  const here = map.latLngToLayerPoint([lat, lon]);
  let best = null, bestD = Infinity;
  for (let i = 0; i < routePath.length - 1; i++) {
    const a = map.latLngToLayerPoint(routePath[i]);
    const b = map.latLngToLayerPoint(routePath[i + 1]);
    const c = L.LineUtil.closestPointOnSegment(here, a, b);
    const d = here.distanceTo(c);
    if (d < bestD) { bestD = d; best = c; }
  }
  return (best && bestD < 80) ? map.layerPointToLatLng(best) : L.latLng(lat, lon);
}

async function loadRoutes() {
  const routes = await getJSON('/api/routes');
  routes.forEach(r => {
    const o = document.createElement('option');
    o.value = r.route_no;
    o.textContent = r.route_no;
    sel.appendChild(o);
  });
  await loadStops();
}

async function loadStops() {
  const token = ++loadToken;
  const stops = await getJSON('/api/route/' + sel.value + '/stops');
  const pts = stops.map(s => [s.latitude, s.longitude]);
  const path = await roadPath(pts, sel.value);
  if (token !== loadToken) return;   // a newer route was chosen meanwhile
  stopLayer.clearLayers();
  routePath = path;
  L.polyline(path, { color: '#ffffff', weight: 9, opacity: .95 }).addTo(stopLayer);
  L.polyline(path, { color: '#c4161c', weight: 5 }).addTo(stopLayer);

  stops.forEach(s => {
    const m = L.circleMarker([s.latitude, s.longitude], {
      radius: 8, color: '#12171a', weight: 3, fillColor: '#f5c400', fillOpacity: 1
    }).addTo(stopLayer);
    m.bindTooltip(s.stop_seq + '. ' + s.name);
    m.on('click', async () => {
      const etas = await getJSON('/api/eta/' + s.stop_id);
      let html = '<b>' + esc(s.name) + '</b>';
      if (etas.length) {
        html += etas.map(e =>
          '<div class="eta"><span>' + esc(e.route_no) + ' (' + esc(e.reg_no) + ')</span><span>' +
          (e.minutes_away <= 0 ? 'due' : e.minutes_away + ' min') +
          (e.current_delay_min > 0 ? ' <span class="late">+' + e.current_delay_min + ' min late</span>' : '') +
          '</span></div>'
        ).join('');
      } else {
        html += '<div>No buses coming</div>';
      }
      m.bindPopup(html).openPopup();
    });
  });

  if (path.length) map.fitBounds(path, { paddingTopLeft: [340, 40], paddingBottomRight: [40, 40] });
  await loadBuses();
}

async function loadBuses() {
  const buses = await getJSON('/api/live');
  busLayer.clearLayers();
  buses.filter(b => b.route_no === sel.value).forEach(b => {
    const icon = L.divIcon({
      className: 'leaflet-div-icon busicon',
      html: '<div class="bus">' + esc(b.reg_no) + '<small>' + esc(b.speed_kmph) + ' km/h</small></div>',
      iconSize: null, iconAnchor: [50, 20]
    });
    L.marker(snapToRoute(b.latitude, b.longitude), { icon: icon }).addTo(busLayer);
  });
  statusEl.textContent = 'UPDATED ' + new Date().toLocaleTimeString();
}

sel.addEventListener('change', loadStops);
loadRoutes();
setInterval(loadBuses, 5000);
</script>
</body>
</html>
